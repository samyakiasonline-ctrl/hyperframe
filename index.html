<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* Camera wrapper: punch-ins scale this, never the timed <video>.
         The origin sits near the top so zooms push the face down, away from
         the graphics band above the head. */
      #cam {
        position: absolute;
        inset: 0;
        z-index: 0;
        transform-origin: 50% 8%;
      }
      #speaker {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Soft shades calm the wood slats behind the top graphics and lift the captions. */
      #shade-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 560px;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(to bottom, rgba(10, 8, 6, 0.6), rgba(10, 8, 6, 0.25) 55%, rgba(10, 8, 6, 0));
      }
      #shade-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 900px;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(to top, rgba(10, 8, 6, 0.55), rgba(10, 8, 6, 0.2) 60%, rgba(10, 8, 6, 0));
      }
      #flash-cut-1,
      #flash-cut-2 {
        z-index: 2;
      }
      #permissions,
      #thesis,
      #growth {
        z-index: 3;
      }
      #captions {
        z-index: 4;
      }
      #end-card {
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18.4"
      data-fps="25"
      data-width="1080"
      data-height="1920"
    >
      <!-- A-roll: dense-keyframe 1080x1920 re-encode of assets/source.mp4 -->
      <div id="cam">
        <video
          id="speaker"
          src="assets/speaker.mp4"
          playsinline
          data-start="0"
          data-duration="16.48"
          data-has-audio="true"
          data-track-index="0"
        ></video>
      </div>
      <div id="shade-top"></div>
      <div id="shade-bottom"></div>

      <!-- Flash cuts hide the two morph jumps in the footage (5.8s, 12.6s). -->
      <div
        id="flash-cut-1"
        class="clip"
        data-composition-id="flash-cut-1"
        data-composition-src="compositions/flash-cut-1.html"
        data-start="5.5"
        data-duration="0.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="flash-cut-2"
        class="clip"
        data-composition-id="flash-cut-2"
        data-composition-src="compositions/flash-cut-2.html"
        data-start="12.28"
        data-duration="0.7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Motion graphics, one scene per beat of the script. -->
      <div
        id="permissions"
        class="clip"
        data-composition-id="permissions"
        data-composition-src="compositions/permissions.html"
        data-start="0"
        data-duration="9.74"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="thesis"
        class="clip"
        data-composition-id="thesis"
        data-composition-src="compositions/thesis.html"
        data-start="9.45"
        data-duration="3.3"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="growth"
        class="clip"
        data-composition-id="growth"
        data-composition-src="compositions/growth.html"
        data-start="12.55"
        data-duration="3.95"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="16.44"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="end-card"
        class="clip"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        data-start="16.1"
        data-duration="2.3"
        data-track-index="4"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Sound effects (bundled Pixabay library, see assets/sfx/CREDITS.md).
           data-start = on-screen event − the file's transient offset. -->
      <!-- Whooshes: transitions -->
      <audio id="sfx-whoosh-intro" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.57" data-track-index="10" data-volume="0.3"></audio>
      <audio id="sfx-whoosh-flash-1" src="assets/sfx/whoosh.mp3" data-start="5.6" data-duration="0.57" data-track-index="10" data-volume="0.38"></audio>
      <audio id="sfx-whoosh-thesis" src="assets/sfx/whoosh-short.mp3" data-start="9.3" data-duration="0.57" data-track-index="10" data-volume="0.28"></audio>
      <audio id="sfx-whoosh-flash-2" src="assets/sfx/whoosh.mp3" data-start="12.38" data-duration="0.57" data-track-index="10" data-volume="0.38"></audio>
      <audio id="sfx-whoosh-end" src="assets/sfx/whoosh-short.mp3" data-start="16.12" data-duration="0.57" data-track-index="10" data-volume="0.34"></audio>
      <!-- Pops: each permission unlocks, and the ≠ slash -->
      <audio id="sfx-pop-reinvent" src="assets/sfx/pop.mp3" data-start="0.81" data-duration="0.72" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-pop-outgrow" src="assets/sfx/pop.mp3" data-start="3.29" data-duration="0.72" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-pop-confident" src="assets/sfx/pop.mp3" data-start="7.37" data-duration="0.72" data-track-index="11" data-volume="0.42"></audio>
      <audio id="sfx-pop-not-equal" src="assets/sfx/pop.mp3" data-start="10.63" data-duration="0.72" data-track-index="11" data-volume="0.36"></audio>
      <!-- Clicks: small text landings -->
      <audio id="sfx-click-past" src="assets/sfx/click-soft.mp3" data-start="9.88" data-duration="0.37" data-track-index="12" data-volume="0.32"></audio>
      <audio id="sfx-click-equals" src="assets/sfx/click-soft.mp3" data-start="10.33" data-duration="0.37" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-click-recap-1" src="assets/sfx/click-soft.mp3" data-start="17.18" data-duration="0.12" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-click-recap-2" src="assets/sfx/click-soft.mp3" data-start="17.3" data-duration="0.12" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-click-recap-3" src="assets/sfx/click-soft.mp3" data-start="17.42" data-duration="0.12" data-track-index="12" data-volume="0.3"></audio>
      <!-- Accents -->
      <audio id="sfx-chime-list" src="assets/sfx/chime.mp3" data-start="7.5" data-duration="2.5" data-track-index="13" data-volume="0.22"></audio>
      <audio id="sfx-sparkle-future" src="assets/sfx/sparkle.mp3" data-start="12.02" data-duration="1.8" data-track-index="13" data-volume="0.32"></audio>
      <audio id="sfx-chime-end" src="assets/sfx/chime.mp3" data-start="16.42" data-duration="1.98" data-track-index="13" data-volume="0.3"></audio>
      <!-- Low end: thesis punch-in, and a riser that crests into the end card -->
      <audio id="sfx-impact-thesis" src="assets/sfx/impact-bass-1.mp3" data-start="9.47" data-duration="2.12" data-track-index="14" data-volume="0.3"></audio>
      <audio
        id="sfx-riser-end"
        src="assets/sfx/riser.mp3"
        data-start="13.2"
        data-duration="3.9"
        data-track-index="14"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.22},{"t":3.15,"v":0.22},{"t":3.85,"v":0}]}]}'
      ></audio>
    </div>

    <script>
      // Camera: slow pushes, a punch-in on the thesis line, and resets hidden
      // under the flash cuts (5.79s, 12.57s).
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.045, duration: 5.79, ease: "none" }, 0);
      tl.set("#cam", { scale: 1 }, 5.79);
      tl.to("#cam", { scale: 1.04, duration: 9.5 - 5.79, ease: "none" }, 5.79);
      tl.to("#cam", { scale: 1.13, duration: 0.3, ease: "power3.out" }, 9.5);
      tl.to("#cam", { scale: 1.16, duration: 12.57 - 9.8, ease: "none" }, 9.8);
      tl.set("#cam", { scale: 1 }, 12.57);
      tl.to("#cam", { scale: 1.05, duration: 16.48 - 12.57, ease: "none" }, 12.57);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
