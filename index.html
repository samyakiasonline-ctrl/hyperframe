<!doctype html>
<!--
  "AI photo shoots" reel, edited in the Lime Pop house style (.claude/skills/lime-pop-recut).
  Source: assets/lottie.mp4 (12.0s), jump-cut to 10.82s on its two pauses.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "LP Inter";
        src: url("assets/fonts/inter-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "LP Inter";
        src: url("assets/fonts/inter-latin-800-normal.woff2") format("woff2");
        font-weight: 800;
      }
      @font-face {
        font-family: "LP Inter";
        src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "LP Sora";
        src: url("assets/fonts/sora-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      :root {
        --lime: #dcf850;
        --white: #f8f8f0;
        --red: #e8001f;
        --ring: #e2d0be;
        --pill-a: #b06858;
        --pill-b: #904840;
        --card-edge: #120808;
        --card-core: #3a0008;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "LP Inter", sans-serif;
      }
      .full {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #footage {
        overflow: hidden;
      }
      .speaker {
        object-fit: cover;
      }
      /* Framing gradient: bottom of frame fades to pure black, as in the reference. */
      #grade {
        background: linear-gradient(to top, #000 0%, rgba(0, 0, 0, 0.85) 8%, rgba(0, 0, 0, 0) 22%);
        z-index: 2;
      }

      /* ---- Stacked captions ---- */
      #captions {
        z-index: 10;
      }
      .grp {
        position: absolute;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        transform: translateY(-50%);
      }
      .stack {
        display: inline-flex;
        flex-direction: column;
        align-items: stretch;
      }
      .ln {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 0 0.24em;
        white-space: nowrap;
        line-height: 0.92;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .ln.start {
        justify-content: flex-start;
      }
      .ln.end {
        justify-content: flex-end;
      }
      .ln.center {
        justify-content: center;
      }
      .ln.split {
        justify-content: space-between;
      }
      .ln.hero {
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 0.86;
        gap: 0 0.2em;
      }
      /* Bright, high-key footage (white wall, cream sweater): a dark halo replaces the reference's
         dark set as the contrast field behind the type. */
      .w {
        display: inline-block;
        opacity: 0;
        color: var(--white);
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.55),
          0 2px 10px rgba(0, 0, 0, 0.6),
          0 0 34px rgba(0, 0, 0, 0.45);
      }
      .w.lime,
      .ln.hero .w {
        color: var(--lime);
        text-shadow:
          0 0 3px rgba(0, 0, 0, 0.6),
          0 3px 12px rgba(0, 0, 0, 0.65),
          0 0 40px rgba(0, 0, 0, 0.5),
          0 0 22px rgba(220, 248, 80, 0.35);
      }
      .strike {
        position: absolute;
        left: -6%;
        top: 50%;
        width: 112%;
        height: 9px;
        margin-top: -2px;
        border-radius: 5px;
        background: var(--red);
        box-shadow: 0 0 12px rgba(232, 0, 31, 0.55);
        transform-origin: left center;
        opacity: 0;
      }
      .arrow {
        display: inline-block;
        width: 0.95em;
        height: 0.95em;
        align-self: center;
        margin-right: 0.15em;
        opacity: 0;
        filter: drop-shadow(0 0 8px rgba(220, 248, 80, 0.7));
      }
      .dot {
        display: inline-block;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 12px rgba(232, 0, 31, 0.8);
        align-self: flex-start;
        margin-left: -0.05em;
        opacity: 0;
      }

      /* ---- Transitions ---- */
      #wash {
        background: #fff;
        opacity: 0;
        z-index: 30;
      }
      #stripes {
        background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.95) 0 7px, rgba(255, 255, 255, 0) 7px 16px);
        opacity: 0;
        z-index: 31;
      }

      /* ---- Props ---- */
      #ring {
        position: absolute;
        border-radius: 50%;
        border: 4px solid var(--ring);
        box-shadow:
          0 0 24px rgba(226, 208, 190, 0.6),
          inset 0 0 24px rgba(226, 208, 190, 0.25);
        opacity: 0;
        z-index: 8;
      }
      #pill {
        position: absolute;
        display: flex;
        gap: 0 0.22em;
        padding: 16px 30px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--pill-a), var(--pill-b));
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
        font-weight: 500;
        font-size: 34px;
        letter-spacing: -0.03em;
        color: var(--white);
        white-space: nowrap;
        opacity: 0;
        z-index: 12;
        transform-origin: left bottom;
      }
      #pill::after {
        content: "";
        position: absolute;
        left: -6px;
        bottom: -6px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--pill-b);
      }
      #pill .pw {
        display: inline-block;
        opacity: 0;
      }
      #rec {
        z-index: 9;
        opacity: 0;
      }
      .br {
        position: absolute;
        width: 90px;
        height: 80px;
        border: 0 solid var(--white);
        filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.55));
      }
      .br.tl {
        left: 75px;
        top: 130px;
        border-left-width: 3px;
        border-top-width: 3px;
      }
      .br.tr {
        right: 75px;
        top: 130px;
        border-right-width: 3px;
        border-top-width: 3px;
      }
      .br.bl {
        left: 75px;
        bottom: 130px;
        border-left-width: 3px;
        border-bottom-width: 3px;
      }
      .br.brr {
        right: 75px;
        bottom: 130px;
        border-right-width: 3px;
        border-bottom-width: 3px;
      }
      #rec-label {
        position: absolute;
        left: 125px;
        top: 168px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 800;
        font-size: 34px;
        letter-spacing: 0.02em;
        color: var(--white);
        /* Bright wall behind it: a camera-HUD backing keeps the label readable. */
        padding: 8px 18px 8px 14px;
        margin: -8px 0 0 -14px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.55);
      }
      #rec-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 10px rgba(232, 0, 31, 0.8);
      }
      #crosshair {
        position: absolute;
        right: 100px;
        bottom: 150px;
        width: 34px;
        height: 34px;
        filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.55));
        background:
          linear-gradient(var(--white), var(--white)) center / 3px 100% no-repeat,
          linear-gradient(var(--white), var(--white)) center / 100% 3px no-repeat;
      }
      #cards {
        z-index: 12;
      }
      .card {
        position: absolute;
        left: 205px;
        width: 670px;
        height: 120px;
        display: flex;
        align-items: center;
        gap: 0 34px;
        padding: 0 40px;
        border-radius: 30px;
        background: radial-gradient(ellipse 65% 130% at 50% 115%, rgba(210, 0, 24, 0.9), var(--card-core) 45%, var(--card-edge) 82%);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 60px rgba(232, 0, 31, 0.28);
        font-family: "LP Sora", sans-serif;
        font-size: 46px;
        letter-spacing: -0.04em;
        color: var(--white);
        white-space: nowrap;
        opacity: 0;
      }
      .card svg {
        flex: 0 0 auto;
        width: 50px;
        height: 50px;
      }
      .card .txt {
        display: flex;
        gap: 0 0.24em;
      }
      .card .cw {
        display: inline-block;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.82" data-width="1080" data-height="1920">
      <!-- A-roll. The wrapper takes the flash punch-in and blur-through; the video pixels stay untouched. -->
      <div id="footage" class="full">
        <!-- Jump cuts on the pauses after "aesthetics" (3.66-4.20) and "branding" (6.46-6.76). -->
        <video id="seg-a" class="clip full speaker" src="assets/lottie.mp4" data-start="0.0" data-duration="3.42" data-media-start="0.4" data-has-audio="true" data-track-index="0"></video>
        <video id="seg-b" class="clip full speaker" src="assets/lottie.mp4" data-start="3.42" data-duration="2.26" data-media-start="4.2" data-has-audio="true" data-track-index="0"></video>
        <video id="seg-c" class="clip full speaker" src="assets/lottie.mp4" data-start="5.68" data-duration="5.14" data-media-start="6.76" data-has-audio="true" data-track-index="0"></video>
      </div>
      <div id="grade" class="full"></div>

      <div id="ring"></div>
      <div id="pill"></div>

      <div id="rec" class="full">
        <div class="br tl"></div>
        <div class="br tr"></div>
        <div class="br bl"></div>
        <div class="br brr"></div>
        <div id="rec-label"><span id="rec-dot"></span><span>REC</span></div>
        <div id="crosshair"></div>
      </div>
      <div id="cards" class="full"></div>
      <div id="captions" class="full"></div>

      <div id="wash" class="full"></div>
      <div id="stripes" class="full"></div>

      <!-- SFX only, no music bed (as in the reference). -->
      <audio id="sfx-shimmer" src="assets/sfx/sparkle.mp3" data-start="0.9" data-duration="1.2" data-volume="0.28" data-track-index="4"></audio>
      <audio id="sfx-sweep" src="assets/sfx/whoosh-short.mp3" data-start="3.12" data-duration="0.57" data-volume="0.5" data-track-index="4"></audio>
      <audio id="sfx-boom" src="assets/sfx/impact-bass-1.mp3" data-start="3.38" data-duration="0.8" data-volume="0.3" data-track-index="5"></audio>
      <audio id="sfx-hit" src="assets/sfx/impact-bass-2.mp3" data-start="5.64" data-duration="0.7" data-volume="0.2" data-track-index="5"></audio>
      <audio id="sfx-rec" src="assets/sfx/ping.mp3" data-start="8.19" data-duration="1.0" data-volume="0.22" data-track-index="6"></audio>
      <audio id="sfx-shutter" src="assets/sfx/click.mp3" data-start="9.3" data-duration="0.37" data-volume="0.6" data-track-index="6"></audio>
    </div>

    <script>
      // ---------- Content (edit me) ----------
      // Word = [text, onsetSeconds, "lime"?]. "|" = flexible spacer in a split line.
      // Line: { kind: "lead" | "hero" | "tail", align, size (x hero size), strike, arrow, dot }
      const HERO_PX = 158; // hero font size before fit
      const HERO_MAX_W = 860; // hero line never wider than this (80% of 1080)
      const FACE = { x: 530, y: 800 }; // face centre in this footage (1080x1920 space)
      const RING = { x: 530, y: 800, d: 560 }; // ring stays on the face
      const INSERT_SCALE = 1.2; // punch-in for the "Branding" beat
      // Output times = source onsets (transcript.json) minus 0.40 / 0.78 / 1.08 for segments A / B / C.
      const GROUPS = [
        { in: 0.0, out: 2.14, y: 1240, lines: [
          { kind: "lead", align: "start", size: 0.5, words: [["People", 0.09], ["think", 0.48]] },
          { kind: "hero", words: [["AI", 0.9], ["Photo", 1.28], ["Shoots", 1.68]] },
        ] },
        { in: 2.16, out: 3.42, y: 1240, lines: [
          { kind: "lead", align: "start", size: 0.42, words: [["are", 2.16], ["just", 2.32], ["about", 2.5]] },
          { kind: "hero", strike: 3.0, words: [["Aesthetics", 2.72]] },
        ] },
        { in: 3.54, out: 5.68, y: 1330, lines: [
          { kind: "lead", align: "start", size: 0.4, words: [["but", 3.54], ["it's", 3.84], ["really", 4.42], ["about", 4.66]] },
          { kind: "hero", size: 1.15, words: [["Branding", 4.98]] },
        ] },
        { in: 5.76, out: 7.46, y: 1240, lines: [
          { kind: "lead", align: "end", size: 0.42, arrow: 6.5, words: [["And", 5.76], ["that's", 5.8], ["exactly", 6.12]] },
          { kind: "hero", words: [["What", 6.6], ["I", 6.84], ["Teach", 7.01]] },
        ] },
        { in: 7.48, out: 10.82, y: 1240, lines: [
          { kind: "lead", align: "start", size: 0.42, words: [["inside", 7.48], ["the", 7.95]] },
          { kind: "hero", words: [["AI", 8.19], ["Photo", 8.73], ["Shoot", 9.0]] },
          { kind: "tail", align: "end", size: 0.62, words: [["Masterclass", 9.32, "lime"]] },
        ] },
      ];
      const CUTS = [5.68]; // jump cut masked with blur-through
      const FLASH = 3.42; // the one stripe flash: the turn from "aesthetics" to "branding"
      const SHUTTER = 9.32; // camera-shutter wash on "Masterclass"
      const PROPS = {
        insert: { in: 3.42, out: 5.68 }, // punch-in under the flash, released on the blur-through cut
        ring: { in: 3.42, out: 5.68 },
        pill: null,
        rec: { in: 8.15, out: 99 }, // camera viewfinder for the photo-shoot offer, holds to the end
        cards: [],
        cardsOut: 0,
      };

      // ---------- Build (no need to edit below) ----------
      const ICONS = {
        warn: '<svg viewBox="0 0 24 24"><path d="M12 2.5 1.6 20.5h20.8z" fill="#e8001f"/><rect x="11" y="9" width="2" height="6.5" rx="1" fill="#fff"/><circle cx="12" cy="18" r="1.2" fill="#fff"/></svg>',
        money: '<svg viewBox="0 0 24 24"><path d="M2 8.5 6.5 5l1 3.5M22 8.5 17.5 5l-1 3.5" stroke="#f8f8f0" stroke-width="1.6" fill="none" stroke-linejoin="round"/><rect x="4" y="8.5" width="16" height="10" rx="1.6" fill="#7fbf6a"/><circle cx="12" cy="13.5" r="2.6" fill="#d9f2c8"/></svg>',
        arrow: '<svg viewBox="0 0 24 24"><path d="M21 3 3 10.5l7.2 2.8L13 21z" fill="none" stroke="#dcf850" stroke-width="1.8" stroke-linejoin="round"/></svg>',
      };
      const tl = gsap.timeline({ paused: true });
      const ft = (el, from, to, at) => tl.fromTo(el, from, Object.assign({ immediateRender: false }, to), at);
      const mk = (tag, cls, parent) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        parent.appendChild(e);
        return e;
      };
      const popWord = (el, at, hero) =>
        ft(el,
          { opacity: 0, scale: hero ? 1.22 : 1.06, filter: hero ? "blur(10px)" : "blur(6px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: hero ? 0.16 : 0.14, ease: hero ? "power3.out" : "power2.out" },
          at);

      function buildCaptions() {
        const host = document.getElementById("captions");
        GROUPS.forEach((g, gi) => {
          const grp = mk("div", "grp", host);
          grp.style.top = g.y + "px";
          const stack = mk("div", "stack", grp);
          // Hero first, so the other lines can size off it.
          const heroDef = g.lines.find((l) => l.kind === "hero");
          let heroPx = HERO_PX * (heroDef.size || 1);
          g.lines.forEach((l) => {
            const ln = mk("div", "ln " + (l.kind === "hero" ? "hero center" : l.align || "start"), stack);
            l.el = ln;
            if (l.arrow != null) {
              const a = mk("span", "arrow", ln);
              a.innerHTML = ICONS.arrow;
              ft(a, { opacity: 0, x: -80, y: 90, rotation: -120 }, { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.4, ease: "back.out(1.6)" }, l.arrow);
            }
            l.words.forEach((w) => {
              if (w === "|") {
                mk("span", "", ln).style.flex = "1 1 auto";
                return;
              }
              const s = mk("span", "w" + (w[2] === "lime" ? " lime" : ""), ln);
              s.setAttribute("data-layout-allow-overlap", ""); // the tight stack overlaps on purpose
              s.textContent = w[0];
              w.el = s;
            });
            if (l.dot != null) {
              const d = mk("span", "dot", ln);
              ft(d, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(3)" }, l.dot);
            }
          });
          // Fit the hero line, then size lead/tail relative to it.
          heroDef.el.style.fontSize = heroPx + "px";
          if (heroDef.el.scrollWidth > HERO_MAX_W) {
            heroPx = (heroPx * HERO_MAX_W) / heroDef.el.scrollWidth;
            heroDef.el.style.fontSize = heroPx + "px";
          }
          g.lines.forEach((l) => {
            if (l.kind === "hero") return;
            l.el.style.fontSize = heroPx * (l.size || 0.45) + "px";
            if (l.kind === "lead") l.el.style.marginBottom = -heroPx * 0.08 + "px";
            if (l.kind === "tail") l.el.style.marginTop = -heroPx * 0.06 + "px";
          });
          if (heroDef.strike != null) {
            const st = mk("div", "strike", heroDef.el);
            ft(st, { opacity: 1, scaleX: 0, rotation: -4 }, { opacity: 1, scaleX: 1, rotation: -4, duration: 0.22, ease: "power2.out" }, heroDef.strike);
          }
          g.lines.forEach((l) => l.words.forEach((w) => w !== "|" && popWord(w.el, w[1], l.kind === "hero")));
          // Exit: blur-out into the cut (the last group simply holds to the end).
          if (gi < GROUPS.length - 1) {
            ft(stack, { opacity: 1, filter: "blur(0px)", scale: 1 }, { opacity: 0, filter: "blur(14px)", scale: 1.04, duration: 0.18, ease: "power2.in" }, g.out - 0.18);
          }
        });
      }

      function buildTransitions() {
        const footage = document.getElementById("footage");
        CUTS.forEach((c) => {
          ft(footage, { filter: "blur(0px)" }, { filter: "blur(16px)", duration: 0.12, ease: "power1.in" }, c - 0.12);
          ft(footage, { filter: "blur(16px)" }, { filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, c);
        });
        ft("#wash", { opacity: 0 }, { opacity: 0.55, duration: 0.17, ease: "power2.in" }, FLASH - 0.17);
        ft("#wash", { opacity: 0.55 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, FLASH);
        ft("#stripes", { opacity: 0, backgroundPositionX: "0px" }, { opacity: 1, backgroundPositionX: "20px", duration: 0.17, ease: "power2.in" }, FLASH - 0.17);
        ft("#wash", { opacity: 0 }, { opacity: 0.6, duration: 0.05, ease: "none" }, SHUTTER - 0.03);
        ft("#wash", { opacity: 0.6 }, { opacity: 0, duration: 0.14, ease: "power2.out" }, SHUTTER + 0.02);
        ft("#stripes", { opacity: 1, backgroundPositionX: "20px" }, { opacity: 0, backgroundPositionX: "40px", duration: 0.18, ease: "power2.out" }, FLASH);
      }

      function buildProps() {
        const footage = document.getElementById("footage");
        const ins = PROPS.insert;
        // Punch in on the face and move it to the ring centre, then punch out 1.15x -> 1x of that.
        footage.style.transformOrigin = FACE.x + "px " + FACE.y + "px";
        const dx = RING.x - FACE.x;
        const dy = RING.y - FACE.y;
        ft(footage, { scale: INSERT_SCALE * 1.15, x: dx, y: dy }, { scale: INSERT_SCALE, x: dx, y: dy, duration: 0.5, ease: "power3.out" }, ins.in);
        tl.set(footage, { scale: 1, x: 0, y: 0 }, ins.out);

        const ring = document.getElementById("ring");
        ring.style.width = ring.style.height = RING.d + "px";
        ring.style.left = RING.x - RING.d / 2 + "px";
        ring.style.top = RING.y - RING.d / 2 + "px";
        ft(ring, { opacity: 0, scale: 1.35 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, PROPS.ring.in);
        tl.set(ring, { opacity: 0 }, PROPS.ring.out);

        const pill = document.getElementById("pill");
        // Sits on the ring's upper-right edge, under the top caption.
        pill.style.left = RING.x + RING.d * 0.16 + "px";
        pill.style.top = RING.y - RING.d * 0.41 + "px";
        if (PROPS.pill) PROPS.pill.words.forEach((w) => {
          const s = mk("span", "pw", pill);
          s.textContent = w[0];
          ft(s, { opacity: 0 }, { opacity: 1, duration: 0.08 }, w[1]);
        });
        if (PROPS.pill) ft(pill, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, PROPS.pill.words[0][1] - 0.05);
        if (PROPS.pill) tl.set(pill, { opacity: 0 }, PROPS.ring.out);

        ft("#rec", { opacity: 0 }, { opacity: 1, duration: 0.2 }, PROPS.rec.in);
        ft("#rec-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.5, repeat: 4, yoyo: true, ease: "steps(1)" }, PROPS.rec.in + 0.3);
        if (PROPS.rec.out < 99) ft("#rec", { opacity: 1 }, { opacity: 0, duration: 0.15 }, PROPS.rec.out - 0.15);

        const cards = document.getElementById("cards");
        PROPS.cards.forEach((c) => {
          const card = mk("div", "card", cards);
          card.style.top = c.y + "px";
          card.innerHTML = ICONS[c.icon];
          const txt = mk("div", "txt", card);
          c.words.forEach((w) => {
            const s = mk("span", "cw", txt);
            s.textContent = w[0];
            ft(s, { opacity: 0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.1 }, w[1]);
          });
          ft(card, { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, c.at);
          ft(card, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.15, ease: "power2.in" }, PROPS.cardsOut - 0.15);
        });
      }

      document.fonts.ready.then(() => {
        buildCaptions();
        buildTransitions();
        buildProps();
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
