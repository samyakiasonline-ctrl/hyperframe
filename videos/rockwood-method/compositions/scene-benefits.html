      <script>
        (function () {
          // Host data-start is 13.6: L() turns a GLOBAL time into a local one on the 25 fps grid.
          const q = (t) => Math.round(t * 25) / 25;
          const L = (g) => q(g - 13.6);
          const tl = gsap.timeline({ paused: true });

          // ---------- Beat 6: foundation (13.62-15.80) ----------
          // ROCK-SOLID drops and lands on the bass thud (14.00): stretch on the fall, squash, settle.
          tl.fromTo("#benefits-rock", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L(13.82));
          tl.fromTo(
            "#benefits-rock",
            { y: -90, scaleX: 0.94, scaleY: 1.1, transformOrigin: "50% 100%" },
            { y: 0, scaleX: 0.96, scaleY: 1.06, duration: 0.16, ease: "power2.in" },
            L(13.82)
          );
          tl.to("#benefits-rock", { scaleX: 1.05, scaleY: 0.88, duration: 0.06, ease: "power2.out" }, L(13.98));
          tl.to("#benefits-rock", { scaleX: 1, scaleY: 1, duration: 0.28, ease: "back.out(2)" }, L(14.04));
          // "financial foundation" joins on "financial" (14.64).
          tl.fromTo("#benefits-fin", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, L(14.56));

          // Three stone blocks drop and stack in the left column, landing 13.95 / 14.30 / 14.64.
          [
            ["#benefits-stone-1", 13.96],
            ["#benefits-stone-2", 14.32],
            ["#benefits-stone-3", 14.64],
          ].forEach(function (s) {
            const id = s[0];
            const land = s[1];
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L(land - 0.16));
            tl.fromTo(
              id,
              { y: -240, scaleX: 0.94, scaleY: 1.08, transformOrigin: "50% 100%" },
              { y: 0, scaleX: 0.96, scaleY: 1.04, duration: 0.16, ease: "power2.in" },
              L(land - 0.16)
            );
            tl.to(id, { scaleX: 1.08, scaleY: 0.84, duration: 0.06, ease: "power2.out" }, L(land));
            tl.to(id, { scaleX: 1, scaleY: 1, duration: 0.26, ease: "back.out(2.2)" }, L(land + 0.06));
            // The whole stack gives a little on each impact.
            tl.fromTo("#benefits-stack", { y: 0 }, { y: 5, duration: 0.06, ease: "power2.out", immediateRender: false }, L(land));
            tl.to("#benefits-stack", { y: 0, duration: 0.2, ease: "power2.out" }, L(land + 0.06));
          });

          // Exit 15.70-15.80.
          tl.to("#benefits-found", { y: -30, opacity: 0, duration: 0.1, ease: "power2.in" }, L(15.7));
          tl.to("#benefits-stones", { y: 24, opacity: 0, duration: 0.12, ease: "power2.in" }, L(15.7));

          // ---------- Beat 7: independence (15.80-17.25) ----------
          tl.fromTo("#benefits-no", { opacity: 0, scale: 0.5, transformOrigin: "100% 60%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, L(15.82));
          tl.fromTo("#benefits-hh", { opacity: 0, scale: 0.5, transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, L(15.96));
          tl.fromTo("#benefits-needed", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.2, ease: "power3.out" }, L(16.56));
          // Two hands, fingertips touching; a gold slash cuts between them and they pull apart.
          tl.fromTo(
            "#benefits-hands",
            { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" },
            { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(1.8)" },
            L(15.96)
          );
          tl.fromTo("#benefits-slash", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L(16.16));
          tl.fromTo("#benefits-slash", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.18, ease: "power2.out" }, L(16.16));
          tl.fromTo("#benefits-hand-l", { x: 0, rotation: 0, svgOrigin: "14 83" }, { x: -8, rotation: -9, svgOrigin: "14 83", duration: 0.32, ease: "power3.out" }, L(16.3));
          tl.fromTo("#benefits-hand-r", { x: 0, rotation: 0, svgOrigin: "146 83" }, { x: 8, rotation: 9, svgOrigin: "146 83", duration: 0.32, ease: "power3.out" }, L(16.3));

          // Exit 17.00-17.08 (camera hard-steps to 1.12x at 17.05).
          tl.to("#benefits-indep", { y: -30, opacity: 0, duration: 0.08, ease: "power2.in" }, L(17.0));
          tl.to("#benefits-hands", { scale: 0.8, opacity: 0, duration: 0.08, ease: "power2.in" }, L(17.0));

          // ---------- Beat 8: callback (17.25-19.57) ----------
          // SELF-GUIDED chip flies back in; the 100% stamp slaps onto it at 17.10 (ping ~17.11).
          tl.fromTo(
            "#benefits-unit",
            { opacity: 0, x: -40, y: -60, rotation: -6, scale: 0.8 },
            { opacity: 1, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.12, ease: "power3.out" },
            L(17.04)
          );
          tl.fromTo("#benefits-stamp", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L(17.04));
          tl.fromTo("#benefits-stamp", { scale: 1.12, rotation: -6 }, { scale: 1, rotation: -6, duration: 0.24, ease: "back.out(2.2)" }, L(17.08));
          tl.fromTo("#benefits-chip", { y: 0 }, { y: 4, duration: 0.04, ease: "power2.out", immediateRender: false }, L(17.12));
          tl.to("#benefits-chip", { y: 0, duration: 0.2, ease: "back.out(2)" }, L(17.16));

          // ZERO HASSLE with a drawn gold check (round caps: hidden until the draw starts).
          tl.fromTo("#benefits-zero", { opacity: 0, y: 22, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "power3.out" }, L(18.72));
          tl.fromTo("#benefits-check", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, L(18.84));
          tl.fromTo("#benefits-check", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, L(18.84));
