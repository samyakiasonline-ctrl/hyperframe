      <script>
        (function () {
          // Local time = global time (host data-start 0). Every time sits on the 25 fps grid.
          const q = (t) => Math.round(t * 25) / 25;
          const CREAM = "#FFF4E6";
          const GOLD = "#D9AD6C";
          const tl = gsap.timeline({ paused: true });

          // ---------- Beat 1: hook (fully visible on frame 0) ----------
          // Each word pulses to gold with a small pop, peaking on its spoken onset, and stays gold.
          [
            ["#hook-w-wall", 1.4],
            ["#hook-w-street", 1.6],
            ["#hook-w-bros", 1.88],
          ].forEach(function (pair) {
            const sel = pair[0];
            const hit = pair[1];
            tl.fromTo(sel, { scale: 1, color: CREAM }, { scale: 1.08, color: GOLD, duration: 0.08, ease: "power3.out" }, q(hit - 0.08));
            tl.to(sel, { scale: 1, duration: 0.16, ease: "power2.out" }, q(hit));
          });
          // Marker strike across WALL STREET BROS (round caps: opacity 0 until the draw starts).
          tl.fromTo("#hook-strike", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, q(2.04));
          tl.fromTo("#hook-strike", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.2, ease: "power2.inOut" }, q(2.04));
          // Whip out left.
          tl.to("#hook-hook", { x: -60, opacity: 0, duration: 0.12, ease: "power2.in" }, q(2.28));

          // ---------- Beat 2: joke ----------
          tl.fromTo("#hook-j1", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, q(2.4));
          tl.fromTo("#hook-j2", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, q(2.44));
          // "potato." nudges as the card lands.
          tl.fromTo("#hook-potato-word", { scale: 1 }, { scale: 1.1, duration: 0.08, ease: "power3.out" }, q(3.52));
          tl.to("#hook-potato-word", { scale: 1, duration: 0.16, ease: "power2.out" }, q(3.6));

          // Potato card drops into the lower stage: stretch on the fall, squash on impact (3.60), settle.
          tl.fromTo("#hook-card", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, q(3.48));
          tl.fromTo(
            "#hook-card",
            { y: -170, scaleX: 0.92, scaleY: 1.12, rotation: -4 },
            { y: 0, scaleX: 0.94, scaleY: 1.08, rotation: 0, duration: 0.12, ease: "power2.in" },
            q(3.48)
          );
          tl.to("#hook-card", { scaleX: 1.1, scaleY: 0.86, duration: 0.08, ease: "power2.out" }, q(3.6));
          tl.to("#hook-card", { scaleX: 1, scaleY: 1, duration: 0.32, ease: "back.out(2.2)" }, q(3.68));
          // Wires zip in, then the calculator wakes up.
          tl.fromTo(".hook-wire", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none", stagger: 0.04 }, q(3.64));
          tl.fromTo(".hook-wire", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.16, ease: "power2.out", stagger: 0.04 }, q(3.64));
          tl.fromTo("#hook-screen-on", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.out" }, q(3.84));
          tl.fromTo("#hook-ticks", { opacity: 0, scale: 0.4, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2)" }, q(3.84));
          tl.to("#hook-ticks", { opacity: 0, duration: 0.08, ease: "power2.in" }, q(4.0));
          // One friendly blink.
          tl.fromTo("#hook-eyes", { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.12, duration: 0.04, ease: "power2.in" }, q(3.92));
          tl.to("#hook-eyes", { scaleY: 1, duration: 0.08, ease: "power2.out" }, q(3.96));
          // Whip out (whoosh peaks ~4.16).
          tl.to(["#hook-j1", "#hook-j2"], { x: -60, opacity: 0, duration: 0.12, ease: "power2.in" }, q(4.08));
          tl.to("#hook-card", { x: -90, rotation: -8, opacity: 0, duration: 0.12, ease: "power2.in" }, q(4.08));

          // ---------- Beat 3: wordmark reveal ----------
          tl.fromTo("#hook-the", { x: -16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.2, ease: "power3.out" }, q(4.44));
          // "Rockwood" slanted mask wipe, left to right, 4.60-5.00 (bass impact at 4.60).
          tl.fromTo(
            "#hook-rock",
            { clipPath: "polygon(0% 0%, 4% 0%, -4% 100%, 0% 100%)" },
            { clipPath: "polygon(0% 0%, 108% 0%, 100% 100%, 0% 100%)", duration: 0.4, ease: "power2.out" },
            q(4.6)
          );
          tl.fromTo("#hook-rock", { scale: 1.05 }, { scale: 1, duration: 0.48, ease: "power2.out" }, q(4.6));
          // Gold edge rides the wipe's leading edge.
          tl.fromTo("#hook-edge", { x: 98, rotation: 15 }, { x: 676, rotation: 15, duration: 0.4, ease: "power2.out" }, q(4.6));
          tl.fromTo("#hook-edge", { opacity: 0 }, { opacity: 1, duration: 0.04, ease: "none" }, q(4.6));
          tl.to("#hook-edge", { opacity: 0, duration: 0.12, ease: "power2.in" }, q(4.84));
          // "METHOD" lands on 5.02.
          tl.fromTo("#hook-method", { y: -28, scale: 1.25, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.24, ease: "back.out(1.8)" }, q(4.96));
          tl.to("#hook-mark", { x: -60, opacity: 0, duration: 0.12, ease: "power2.in" }, q(5.44));

          // ---------- Beat 4: format chips ----------
          // SELF-GUIDED pops centred, then slides left as DOWNLOADABLE grows out beside it.
          tl.fromTo("#hook-chip-self", { x: 210, scale: 0.5, opacity: 0 }, { x: 210, scale: 1, opacity: 1, duration: 0.24, ease: "back.out(2)" }, q(5.52));
          tl.to("#hook-chip-self", { x: 0, duration: 0.24, ease: "power3.out" }, q(6.4));
