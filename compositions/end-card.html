<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Montserrat";
          src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2");
          font-weight: 800;
          font-display: block;
        }
        @font-face {
          font-family: "Instrument Serif";
          src: url("assets/fonts/instrument-serif-latin-400-normal.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Instrument Serif";
          src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
          font-weight: 400;
          font-style: italic;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #end-sheet {
          position: absolute;
          inset: 0;
          background: #f6ecd9;
        }
        #end-edge {
          position: absolute;
          left: 0;
          right: 0;
          top: 0;
          height: 14px;
          background: #ffc94a;
        }
        #end-body {
          position: absolute;
          left: 0;
          right: 0;
          top: 540px;
          display: flex;
          flex-direction: column;
          align-items: center;
          color: #15110c;
        }
        #end-kicker {
          font-family: "Montserrat", sans-serif;
          font-weight: 800;
          font-size: 30px;
          letter-spacing: 0.3em;
          color: #6e5f49;
          margin-bottom: 34px;
        }
        .end-line {
          font-family: "Instrument Serif", serif;
          font-weight: 400;
          font-size: 128px;
          line-height: 1.04;
          white-space: nowrap;
        }
        #end-line-2 {
          position: relative;
          font-style: italic;
          font-size: 184px;
          line-height: 1.02;
          color: #a8650c;
        }
        #end-swash {
          position: absolute;
          left: -10px;
          right: -10px;
          bottom: -14px;
          width: calc(100% + 20px);
          height: 40px;
          overflow: visible;
        }
        #end-recap {
          display: flex;
          gap: 14px;
          margin-top: 130px;
        }
        .end-chip {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 12px 22px 12px 14px;
          border-radius: 999px;
          background: #15110c;
          font-family: "Montserrat", sans-serif;
          font-weight: 800;
          font-size: 26px;
          letter-spacing: 0.06em;
          color: #fff4e0;
        }
        .end-chip svg {
          width: 30px;
          height: 30px;
        }
      </style>

      <div id="root" data-composition-id="end-card" data-width="1080" data-height="1920">
        <div id="end-sheet"></div>
        <div id="end-edge"></div>
        <div id="end-body">
          <div id="end-kicker">A REMINDER</div>
          <div class="end-line" id="end-line-1">Growth is possible</div>
          <div class="end-line" id="end-line-2">
            at any stage
            <svg id="end-swash" viewBox="0 0 600 40" preserveAspectRatio="none">
              <path id="end-swash-path" d="M8 26 C 150 6, 330 6, 592 22" fill="none" stroke="#ffc94a" stroke-width="9" stroke-linecap="round" />
            </svg>
          </div>
          <div class="end-line" id="end-line-3">of life.</div>
          <div id="end-recap">
            <div class="end-chip" id="end-chip-1">
              <svg viewBox="0 0 30 30"><path d="M7 15.5l5 5 11-11" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>
              REINVENT
            </div>
            <div class="end-chip" id="end-chip-2">
              <svg viewBox="0 0 30 30"><path d="M7 15.5l5 5 11-11" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>
              OUTGROW
            </div>
            <div class="end-chip" id="end-chip-3">
              <svg viewBox="0 0 30 30"><path d="M7 15.5l5 5 11-11" fill="none" stroke="#ffc94a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>
              CONFIDENT
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Local time; the host starts at 16.10s. The sheet covers the frame
          // by 16.44s, when the footage runs out.
          const SWASH_LEN = 600;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo(["#end-sheet", "#end-edge"], { y: 1920 }, { y: 0, duration: 0.3, ease: "power3.inOut" }, 0.04);
          tl.to("#end-edge", { opacity: 0, duration: 0.2 }, 0.34);

          tl.fromTo("#end-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.4);
          ["#end-line-1", "#end-line-2", "#end-line-3"].forEach(function (sel, i) {
            tl.fromTo(sel, { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.46 + i * 0.12);
          });
          tl.fromTo("#end-swash-path", { opacity: 0, strokeDasharray: SWASH_LEN, strokeDashoffset: SWASH_LEN }, { opacity: 1, strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 0.95);

          // Recap of the three permissions from the opening.
          [1, 2, 3].forEach(function (n, i) {
            tl.fromTo("#end-chip-" + n, { opacity: 0, y: 20, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.8)" }, 1.15 + i * 0.12);
          });

          window.__timelines["end-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
