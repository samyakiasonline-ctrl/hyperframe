<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #broll-road-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #road-cam {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          display: block;
        }
      </style>

      <!-- B-roll: your past does not have to define your future: the road ahead at sunrise. Illustrated in SVG; swap for a stock clip by
           replacing the <svg> with <video class="clip" src="assets/broll/..." muted>. -->
      <div id="broll-road-root" data-composition-id="broll-road" data-width="1080" data-height="1920" data-duration="2.55">
        <svg id="road-cam" data-layout-allow-overflow viewBox="0 0 1080 1920">
          <defs>
            <linearGradient id="road-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#28306a" />
              <stop offset="0.25" stop-color="#d9798a" />
              <stop offset="0.42" stop-color="#ffc98a" />
            </linearGradient>
            <linearGradient id="road-field" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c9a55a" />
              <stop offset="0.35" stop-color="#6f8a3a" />
              <stop offset="1" stop-color="#22301a" />
            </linearGradient>
            <linearGradient id="road-asphalt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#6d6270" />
              <stop offset="1" stop-color="#17161c" />
            </linearGradient>
            <radialGradient id="road-sun" cx="0.5" cy="0.5" r="0.5">
              <stop offset="0" stop-color="#fff7da" />
              <stop offset="0.3" stop-color="#ffe09a" />
              <stop offset="1" stop-color="#ffb066" stop-opacity="0" />
            </radialGradient>
            <clipPath id="road-sky-clip"><rect width="1080" height="800" /></clipPath>
          </defs>
          <rect width="1080" height="1920" fill="url(#road-sky)" />
          <g clip-path="url(#road-sky-clip)">
            <g id="road-sunwrap">
              <circle cx="540" cy="800" r="360" fill="url(#road-sun)" />
              <circle cx="540" cy="800" r="110" fill="#fff4cf" />
            </g>
          </g>
          <rect y="800" width="1080" height="1120" fill="url(#road-field)" />
          <path d="M0 800 L1080 800" stroke="#ffe3a8" stroke-width="3" opacity="0.8" />
          <polygon points="530,800 550,800 1180,1920 -100,1920" fill="url(#road-asphalt)" />
          <polyline points="530,800 -100,1920" fill="none" stroke="#f3e6c8" stroke-width="10" opacity="0.8" />
          <polyline points="550,800 1180,1920" fill="none" stroke="#f3e6c8" stroke-width="10" opacity="0.8" />
          <g id="road-dashes" fill="#ffd36b"></g>
        </svg>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Whip-in zoom, slow settle, quick fade out.
        function brollInOut(cam, start, dur) {
          tl.fromTo(cam, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1.04, duration: 0.28, ease: "power3.out" }, start);
          tl.fromTo(cam, { scale: 1.04 }, { scale: 1.0, duration: dur - 0.28, ease: "none", immediateRender: false }, start + 0.28);
          tl.fromTo(cam, { opacity: 1 }, { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, start + dur - 0.18);
        }

      brollInOut("#road-cam", 0, 2.55);
      tl.fromTo("#road-sunwrap", { y: 120 }, { y: -30, duration: 2.55, ease: "sine.out" }, 0);
      const dashes = document.getElementById("road-dashes");
      const DASHES = 9;
      const dashEls = [];
      for (let i = 0; i < DASHES; i++) {
        const p = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        dashes.appendChild(p);
        dashEls.push(p);
      }
      // Perspective: depth u in [0,1) maps to screen y with y = 800 + 1120 * u^2.5.
      function drawDashes(phase) {
        dashEls.forEach((el, i) => {
          const u0 = ((i + phase) % DASHES) / DASHES;
          const u1 = Math.min(u0 + 0.45 / DASHES, 1);
          const y0 = 800 + 1120 * Math.pow(u0, 2.5);
          const y1 = 800 + 1120 * Math.pow(u1, 2.5);
          const w0 = 2 + 34 * Math.pow(u0, 2.5);
          const w1 = 2 + 34 * Math.pow(u1, 2.5);
          el.setAttribute("points", `${540 - w0},${y0} ${540 + w0},${y0} ${540 + w1},${y1} ${540 - w1},${y1}`);
        });
      }
      const road = { phase: 0 };
      drawDashes(0);
      tl.fromTo(road, { phase: 0 }, { phase: 2.2, duration: 2.55, ease: "none", onUpdate: () => drawDashes(road.phase) }, 0);

        window.__timelines["broll-road"] = tl;
      </script>
    </template>
  </body>
</html>
