<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Adapted from the HyperFrames registry block editorial-flash-overlay:
         a seek-safe warm camera-flash cut, used here to hide a morph jump in the footage. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #fc2-flash {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #fc2-flash .fc-layer {
          position: absolute;
          inset: 0;
          opacity: 0;
        }
        #fc2-wash {
          background: rgb(255 246 232);
        }
        #fc2-core {
          inset: -18%;
          background: radial-gradient(
            ellipse 70% 60% at 50% 32%,
            rgb(255 255 255) 0%,
            rgb(255 252 246 / 96%) 24%,
            rgb(255 246 232 / 84%) 46%,
            rgb(255 174 105 / 32%) 68%,
            transparent 88%
          );
          mix-blend-mode: screen;
        }
        #fc2-sweep {
          inset: -28%;
          background: linear-gradient(
            108deg,
            transparent 21%,
            rgb(255 174 105 / 12%) 38%,
            rgb(255 246 232 / 90%) 49%,
            rgb(255 255 255 / 98%) 53%,
            rgb(183 218 255 / 22%) 62%,
            transparent 79%
          );
          mix-blend-mode: screen;
        }
      </style>

      <div id="root" data-composition-id="flash-cut-2" data-width="1080" data-height="1920">
        <div id="fc2-flash" aria-hidden="true">
          <div id="fc2-wash" class="fc-layer"></div>
          <div id="fc2-core" class="fc-layer" data-layout-allow-overflow></div>
          <div id="fc2-sweep" class="fc-layer" data-layout-allow-overflow></div>
        </div>
      </div>

      <script>
        (function () {
          // Local seconds: rise, peak, hold over the footage's morph frames, decay.
          const RISE = 0.2;
          const PEAK = 0.26;
          const HOLD_END = 0.32;
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#fc2-wash", { opacity: 0 }, { opacity: 0.94, duration: PEAK - RISE, ease: "power3.in" }, RISE);
          tl.fromTo("#fc2-core", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: PEAK - RISE, ease: "power3.in" }, RISE);
          tl.fromTo("#fc2-sweep", { opacity: 0, xPercent: -14, rotation: -2 }, { opacity: 0.9, xPercent: 6, rotation: -2, duration: PEAK - RISE, ease: "power3.in" }, RISE);
          tl.to("#fc2-wash", { opacity: 0, duration: 0.24, ease: "power2.out" }, HOLD_END);
          tl.to("#fc2-core", { opacity: 0, scale: 1.18, duration: 0.34, ease: "power2.out" }, HOLD_END);
          tl.to("#fc2-sweep", { opacity: 0, xPercent: 28, rotation: -2, duration: 0.3, ease: "power2.out" }, HOLD_END);

          window.__timelines["flash-cut-2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
