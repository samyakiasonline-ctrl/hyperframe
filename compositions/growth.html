<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Montserrat";
          src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        @font-face {
          font-family: "Montserrat";
          src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2");
          font-weight: 900;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          font-family: "Montserrat", sans-serif;
        }
        #growth-panel {
          position: absolute;
          top: 112px;
          left: 56px;
          width: 968px;
          height: 204px;
          border-radius: 40px;
          background: rgba(18, 14, 10, 0.68);
          border: 2px solid rgba(255, 244, 224, 0.18);
          box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4);
        }
        #growth-kicker {
          position: absolute;
          top: 136px;
          left: 100px;
          display: flex;
          align-items: center;
          gap: 10px;
          font-weight: 900;
          font-size: 26px;
          letter-spacing: 0.2em;
          color: #ffc94a;
        }
        #growth-kicker svg {
          width: 30px;
          height: 30px;
        }
        #growth-chart {
          position: absolute;
          top: 112px;
          left: 56px;
          width: 968px;
          height: 204px;
          overflow: visible;
        }
        .growth-age {
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          font-size: 20px;
          fill: rgba(255, 244, 224, 0.82);
          text-anchor: middle;
        }
      </style>

      <div id="root" data-composition-id="growth" data-width="1080" data-height="1920">
        <div id="growth-panel"></div>
        <svg id="growth-chart" viewBox="0 0 968 204">
          <defs>
            <linearGradient id="growth-area-grad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffc94a" stop-opacity="0.38" />
              <stop offset="1" stop-color="#ffc94a" stop-opacity="0" />
            </linearGradient>
            <clipPath id="growth-reveal">
              <rect id="growth-reveal-rect" x="0" y="0" width="0" height="204" />
            </clipPath>
          </defs>
          <line id="growth-axis" x1="70" y1="160" x2="898" y2="160" stroke="rgba(255,244,224,0.3)" stroke-width="2" />
          <g clip-path="url(#growth-reveal)">
            <path id="growth-area" fill="url(#growth-area-grad)" d="M70 146 C93.0 142.3 162.0 126.7 208.0 124 C254.0 121.3 300.0 133.7 346.0 130 C392.0 126.3 438.0 105.7 484.0 102 C530.0 98.3 576.0 111.7 622.0 108 C668.0 104.3 714.0 88.3 760.0 80 C806.0 71.7 875.0 61.7 898.0 58 L898 160 L70 160 Z" />
          </g>
          <path id="growth-line" fill="none" stroke="#ffc94a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M70 146 C93.0 142.3 162.0 126.7 208.0 124 C254.0 121.3 300.0 133.7 346.0 130 C392.0 126.3 438.0 105.7 484.0 102 C530.0 98.3 576.0 111.7 622.0 108 C668.0 104.3 714.0 88.3 760.0 80 C806.0 71.7 875.0 61.7 898.0 58" />
          <g id="growth-dots"></g>
        </svg>
        <div id="growth-kicker">
          <svg viewBox="0 0 30 30">
            <path d="M5 23L13 15l5 5 8-11" fill="none" stroke="#ffc94a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M19 8h7v7" fill="none" stroke="#ffc94a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>GROWTH</span>
        </div>
      </div>

      <script>
        (function () {
          // Local time; the host starts at 12.55s. "Growth" is spoken at 12.88,
          // "any stage of life" 14.96–16.40.
          const AT = function (globalSec) {
            return Math.round((globalSec - 12.55) * 25) / 25;
          };
          const NS = "http://www.w3.org/2000/svg";
          const AGES = ["20", "30", "40", "50", "60", "70", "80+"];
          // Rises at every stage, with small dips: growth is not a straight line.
          const YS = [146, 124, 130, 102, 108, 80, 58];
          const X0 = 70;
          const STEP = (898 - 70) / (AGES.length - 1);
          const pts = YS.map(function (y, i) {
            return [X0 + i * STEP, y];
          });

          // The line and area paths are authored statically: a Catmull-Rom curve
          // through these stage points, converted to cubic Béziers.

          const dots = document.getElementById("growth-dots");
          pts.forEach(function (p, i) {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("id", "growth-stage-" + i);
            const c = document.createElementNS(NS, "circle");
            c.setAttribute("id", "growth-dot-" + i);
            c.setAttribute("cx", p[0]);
            c.setAttribute("cy", p[1]);
            c.setAttribute("r", i === pts.length - 1 ? 12 : 9);
            c.setAttribute("fill", "#15110c");
            c.setAttribute("stroke", "#ffc94a");
            c.setAttribute("stroke-width", "5");
            const t = document.createElementNS(NS, "text");
            t.setAttribute("id", "growth-age-" + i);
            t.setAttribute("class", "growth-age");
            t.setAttribute("x", p[0]);
            t.setAttribute("y", 188);
            t.textContent = AGES[i];
            g.appendChild(c);
            g.appendChild(t);
            dots.appendChild(g);
          });

          const line = document.getElementById("growth-line");
          const LEN = Math.ceil(line.getTotalLength());
          const DRAW_START = AT(13.0);
          const DRAW_DUR = AT(15.92) - DRAW_START;

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#growth-panel", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.36, ease: "power3.out" }, AT(12.62));
          tl.fromTo("#growth-axis", { opacity: 0 }, { opacity: 1, duration: 0.3 }, AT(12.75));
          tl.fromTo("#growth-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" }, AT(12.88));

          // Hidden until drawn: a round cap paints a dot even at full dash offset.
          tl.fromTo("#growth-line", { opacity: 0 }, { opacity: 1, duration: 0.04 }, DRAW_START);
          tl.fromTo("#growth-line", { strokeDasharray: LEN, strokeDashoffset: LEN }, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "none" }, DRAW_START);
          tl.fromTo("#growth-reveal-rect", { attr: { width: 0 } }, { attr: { width: 968 } , duration: DRAW_DUR, ease: "none" }, DRAW_START);
          pts.forEach(function (p, i) {
            const at = DRAW_START + (DRAW_DUR * i) / (pts.length - 1) - 0.04;
            tl.fromTo("#growth-dot-" + i, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, Math.max(DRAW_START, at));
            tl.fromTo("#growth-age-" + i, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, Math.max(DRAW_START, at));
          });
          // The last stage ("life.") gets a gold fill.
          tl.to("#growth-dot-" + (pts.length - 1), { attr: { fill: "#ffc94a" }, duration: 0.2 }, AT(16.08));

          window.__timelines["growth"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
